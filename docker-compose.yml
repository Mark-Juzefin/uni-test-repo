services:
  psql:
    container_name: psql
    image: postgres:16
    environment:
      POSTGRES_DB: "legaltech_test"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "root"
    ports:
      - "5432:5432"
    volumes:
      - psql_data:/var/lib/postgresql/data

  redpanda:
    container_name: redpanda
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - redpanda_data:/var/lib/redpanda/data

  redpanda-console:
    container_name: redpanda-console
    image: redpandadata/console:v2.7.0
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8080:8080"
    depends_on:
      redpanda:
        condition: service_healthy

  prometheus:
    image: prom/prometheus
    volumes:
      - "./prometheus.yml:/etc/prometheus/prometheus.yml"
    ports:
      - 9090:9090

  # LocalStack disabled until SQS integration. Re-enable when wiring notifications service.
  # Pin to community version (e.g. localstack/localstack:3.8) — :latest now requires auth token.
  # localstack:
  #   container_name: localstack
  #   image: localstack/localstack:3.8
  #   ports:
  #     - "4566:4566"
  #   environment:
  #     - SERVICES=sqs
  #     - AWS_DEFAULT_REGION=us-east-1
  #     - AWS_ACCESS_KEY_ID=test
  #     - AWS_SECRET_ACCESS_KEY=test
  #   volumes:
  #     - "./init-localstack.sh:/etc/localstack/init/ready.d/init-localstack.sh"
  #     - localstack_data:/var/lib/localstack

volumes:
  psql_data:
  redpanda_data: