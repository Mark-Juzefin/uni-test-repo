services:
  psql:
    container_name: psql
    image: postgres:16
    environment:
      POSTGRES_DB: "legaltech_test"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "root"
    ports:
      - "5432:5432"
    volumes:
      - psql_data:/var/lib/postgresql/data

  prometheus:
    image: prom/prometheus
    volumes:
      - "./prometheus.yml:/etc/prometheus/prometheus.yml"
    ports:
      - 9090:9090

  # LocalStack disabled until SQS integration. Re-enable when wiring notifications service.
  # Pin to community version (e.g. localstack/localstack:3.8) — :latest now requires auth token.
  # localstack:
  #   container_name: localstack
  #   image: localstack/localstack:3.8
  #   ports:
  #     - "4566:4566"
  #   environment:
  #     - SERVICES=sqs
  #     - AWS_DEFAULT_REGION=us-east-1
  #     - AWS_ACCESS_KEY_ID=test
  #     - AWS_SECRET_ACCESS_KEY=test
  #   volumes:
  #     - "./init-localstack.sh:/etc/localstack/init/ready.d/init-localstack.sh"
  #     - localstack_data:/var/lib/localstack

volumes:
  psql_data: